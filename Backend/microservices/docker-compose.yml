services:
  reviews:
    build: ./reviews
    restart: always
    environment:
      DB_HOST: reviews-db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE_REVIEWS}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OUTER_BACKEND_URL: ${OUTER_BACKEND_URL}
    depends_on:
      redis:
        condition: service_healthy
      reviews-db:
        condition: service_healthy
    networks:
      - backend

  reviews-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE_REVIEWS}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - reviews_data:/var/lib/mysql
    networks:
      - backend

  notifications:
    build: ./notifications
    restart: always
    environment:
      DB_HOST: notifications-db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE_NOTIFICATIONS}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_ROOT_PASSWORD}
      USERS_API: http://notifications:3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OUTER_BACKEND_URL: ${OUTER_BACKEND_URL}
    depends_on:
      notifications-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  notifications-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE_NOTIFICATIONS}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - notifications_data:/var/lib/mysql
    networks:
      - backend

  redis:
    image: redis:7
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  nginx:
    build:
      context: ../..
      dockerfile: Backend/microservices/nginx/Dockerfile
    container_name: microservices-nginx
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      reviews:
        condition: service_started
      notifications:
        condition: service_started
    networks:
      - backend

volumes:
  reviews_data:
  notifications_data:

networks:
  backend:
    driver: bridge