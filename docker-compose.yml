services:
  database:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app-network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: nginx-container
    ports:
      - "80:80"     
      - "443:443"    
    depends_on:
      - frontend
      - backend
      - image-server
    networks:
      - app-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: backend_service
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network
    
  image-server:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: upload-server
    container_name: image_service_service
    environment:
      UPLOAD_PORT: 3002
    volumes:
      - ./Frontend/public/imagens:/app/public/imagens
    networks:
      - app-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: frontend
    container_name: frontend_service
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network: