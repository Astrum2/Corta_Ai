services:
  database:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: corta_ai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: backend_service
    ports:
      - "3001:3001"
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: corta_ai
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: mysupersecretpassword
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network
    
  image-server:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: upload-server
    container_name: image_server_service
    ports:
      - "3002:3002"
    environment:
      UPLOAD_PORT: 3002
    volumes:
      - ./Frontend/public/imagens:/app/public/imagens
    networks:
      - app-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: frontend
    container_name: frontend_service
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      -app-network

volumes:
  mysql_data:

networks:
  app-network: