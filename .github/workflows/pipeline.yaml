name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  CI: true

jobs:
  test:
    name: Install and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - path: Backend
            name: Backend
          - path: Backend/microservices/reviews
            name: Reviews microservice
          - path: Frontend
            name: Frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ${{ matrix.project.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project.path }}
        run: npm install

      - name: Run tests
        working-directory: ${{ matrix.project.path }}
        run: npm test --if-present

  deploy:
    name: Simulate production rolling update
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulate rolling update deployment
        run: |
          echo "Starting production rolling update..."
          echo "Deploying new instances while existing instances remain available."
          echo "Waiting for health checks before replacing old instances..."
          echo "Rolling update completed successfully (simulation only)."
